name: Display layout checks
on:
  push:
    branches: [display-layouts]
    paths:
      - patches/dashboard-layouts.patch
      - .github/workflows/display_preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  display:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_27.0.app/Contents/Developer
      - name: Apply display patch
        run: git apply --check patches/dashboard-layouts.patch && git apply patches/dashboard-layouts.patch
      - name: Build plugins before the test host
        run: |
          # The host copy script scans .loopplugin products without target dependencies.
          # Complete those products first so it cannot embed half-built frameworks.
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          directory = Path('LoopWorkspace.xcworkspace/xcshareddata/xcschemes')
          source = ET.parse(directory / 'LoopWorkspace.xcscheme').getroot()
          root = ET.Element('Scheme', {'version': '1.3'})
          action = ET.SubElement(root, 'BuildAction', {'parallelizeBuildables': 'YES', 'buildImplicitDependencies': 'YES'})
          entries = ET.SubElement(action, 'BuildActionEntries')
          for entry in source.findall('./BuildAction/BuildActionEntries/BuildActionEntry'):
              reference = entry.find('BuildableReference')
              if reference.get('BuildableName', '').endswith(('.loopplugin', '.framework')):
                  entries.append(entry)
          assert len(entries) > 0
          ET.ElementTree(root).write(directory / 'DisplayPlugins.xcscheme', encoding='UTF-8', xml_declaration=True)
          PYTHON
          set -o pipefail
          xcodebuild -workspace LoopWorkspace.xcworkspace -scheme DisplayPlugins -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath "$RUNNER_TEMP/display-${GITHUB_RUN_ID}" build SUPPORTS_MACCATALYST=NO 2>&1 | xcbeautify
      - name: Test display fallback and existing glucose staleness handling
        run: |
          set -o pipefail
          mkdir -p display-results
          xcodebuild -workspace LoopWorkspace.xcworkspace -scheme LoopWorkspace -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath "$RUNNER_TEMP/display-${GITHUB_RUN_ID}" -collect-test-diagnostics never -resultBundlePath display-results/Display.xcresult -only-testing:LoopTests/LoopTests test SUPPORTS_MACCATALYST=NO 2>&1 | tee display-results/build.log | xcbeautify
      - name: Export screenshots and raw failure details
        if: always()
        run: |
          tail -100 display-results/build.log
          xcrun xcresulttool export attachments --path display-results/Display.xcresult --output-path display-results/screenshots || true
      - name: Save test results and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: display-results
          path: display-results
